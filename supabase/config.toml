
# Public form endpoint — anonymous callers are allowed through and the
# function does its own Turnstile check (see index.ts). Deploy with:
#   npx supabase functions deploy subscribe-notify --no-verify-jwt
[functions.subscribe-notify]
verify_jwt = false

[functions.cashfree-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/cashfree-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/cashfree-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/cashfree-webhook/*.html" ]
