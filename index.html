    <!-- ═══ PRIMARY SEO META ══════════════════════════════════════════
         description, canonical, robots, and OG title/description/url
         below are now set per-route by src/components/SEO.jsx
         (react-helmet-async), one real value per real page — NOT
         duplicated here, since Helmet appends rather than replaces raw
         static tags, and e.g. "index,follow" + "noindex,nofollow" both
         present is worse than either alone. No static robots tag means
         "indexable" by default (browser/crawler spec default when the
         tag is absent), matching the old explicit "index, follow" for
         every route Helmet doesn't mark noindex. This static <title>
         stays as the initial paint value (Helmet overwrites document.title
         directly, no duplication risk) and is also what non-JS crawlers/
         link-preview bots see, since they never run the client-side
         per-route override. ══════════════════════════════════════════ -->
    <title>Chavee — India's First Student Social Platform | Learn Earn Network Belong</title>
    <meta name="keywords" content="student platform India, India first student social network, student community India, learn Korean India, earn as student India, student networking platform India, college students India, scholarship platform India, student events India, Chavee, chavee.in, Kerala student platform, student social media India, campus platform India, Gen Z student platform, student gig marketplace India, peer mentorship students India, language learning students India, study sync India, student mentor platform India" />
    <meta name="author" content="Chavee Technologies" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- ═══ GEO / LOCAL SEO ═══════════════════════════════════════════ -->

    <meta name="geo.placename" content="Calicut, Kerala, India" />
    <meta name="geo.position" content="11.0510;76.0711" />
    <meta name="ICBM" content="11.0510, 76.0711" />
    <meta name="DC.title" content="Chavee — Kerala Student Platform" />

    <!-- ═══ OPEN GRAPH — og:url/title/description are per-route via
